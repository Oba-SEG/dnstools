services:
  - type: web
    name: ndns-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://oba-seg.github.io"
      - key: NODE_ENV
        value: production
