name: Keep Render API warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --max-time 90 https://ndns-api.onrender.com/health
          echo
